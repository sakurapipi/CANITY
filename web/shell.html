<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>CANITY — 浏览器版</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a; color: #c8d0dc;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;          /* letterbox 由 CSS 负责，不拉伸 */
    image-rendering: pixelated;   /* 像素风：放大不糊 */
    background: #000;
    cursor: default;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; background: #05070a; z-index: 10;
    transition: opacity .35s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot h1 {
    margin: 0; font-size: clamp(28px, 7vw, 64px);
    letter-spacing: .34em; color: #e8c040; font-weight: 700;
  }
  #boot .sub { color: #6f7d90; letter-spacing: .18em; font-size: clamp(10px, 2.4vw, 14px); }
  #bar { width: min(420px, 70vw); height: 4px; background: #141a22; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0%; background: #e8c040; transition: width .2s; }
  #status { color: #8b98a8; font-size: 12px; letter-spacing: .1em; }
  #entry {
    position: fixed; right: 16px; bottom: 14px; z-index: 11;
    display: flex; gap: 10px; align-items: center;
    font-size: 12px; letter-spacing: .08em;
  }
  #entry a {
    color: #9fb0c4; text-decoration: none;
    border: 1px solid #2a3542; padding: 7px 12px; border-radius: 3px;
    background: rgba(10,16,22,.82);
  }
  #entry a:hover { color: #e8c040; border-color: #4a5a6c; }
  #entry a.primary { color: #e8c040; border-color: #6a5a20; }

  /* 触屏操作层 v5：左半屏移动 + 右半屏视角 + 7 个按钮 */
  #touch { position: fixed; inset: 0; z-index: 12; display: none; }
  #touch.on { display: block; }
  #touch > * { pointer-events: none; }

  #movezone { position: absolute; left: 0; top: 0; width: 46%; height: 100%;
              pointer-events: auto; touch-action: none; }
  #look     { position: absolute; right: 0; top: 0; width: 54%; height: 100%;
              pointer-events: auto; touch-action: none; }

  #stick {
    position: absolute; display: none;
    width: 116px; height: 116px; margin: -58px 0 0 -58px;
    border-radius: 50%;
    border: 1px solid rgba(120,140,165,.45);
    background: rgba(12,18,24,.18);
    pointer-events: none;
  }
  #stick.on { display: block; }
  #stick > i {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: rgba(232,192,64,.22);
    border: 1px solid rgba(200,170,80,.60);
  }

  #btns, #btns2 {
    position: absolute;
    right: calc(12px + env(safe-area-inset-right, 0px));
    display: grid; gap: 10px;
    pointer-events: none;
  }
  #btns  { bottom: calc(12px + env(safe-area-inset-bottom, 0px));
           grid-template-columns: repeat(2, min(15vw, 62px)); }
  #btns2 { top: calc(10px + env(safe-area-inset-top, 0px));
           grid-template-columns: repeat(2, min(15vw, 62px)); }

  #btns button, #btns2 button {
    width: min(15vw, 62px); height: min(15vw, 62px);
    border-radius: 50%;
    border: 1px solid rgba(120,140,165,.42);
    background: rgba(14,20,28,.30);
    color: rgba(207,216,228,.85);
    font: 600 13px/1.2 ui-monospace, monospace;
    pointer-events: auto; touch-action: none;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  #btns button:active, #btns2 button:active {
    background: rgba(232,192,64,.32); color: #ffe27a;
    border-color: rgba(232,192,64,.75);
  }

  /* 竖屏提示：手机上竖着拿根本看不清，直接让用户横过来 */
  #rotate {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: #05070a; color: #c8d0dc;
    font: 600 15px/1.9 ui-monospace, monospace; text-align: center;
  }
  #rotate.on { display: flex; }

  /* 触屏横屏时，下载入口移到右上角并缩小 ——
     原来贴右下角，正好压在「投掷」按钮上。 */
  @media (pointer: coarse), (max-height: 520px) {
    /* 挪到**左上**：右上角被手电/暂停两个按钮占了 */
    #entry {
      right: auto; bottom: auto;
      left: calc(8px + env(safe-area-inset-left, 0px));
      top: calc(6px + env(safe-area-inset-top, 0px));
      font-size: 9px; opacity: .55;
    }
    #entry a { padding: 4px 8px; }
  }
  #rotate .icon { font-size: 46px; color: #e8c040; }
  #rotate .lnk {
    margin-top: 6px; padding: 9px 16px; border-radius: 4px;
    border: 1px solid #3a4656; color: #9fb0c4; text-decoration: none;
    pointer-events: auto;
  }

  :root{--canity-accent:#7bcdf2}
  html,body{height:100dvh}
  #btns button,#btns2 button,#rhythmTouch button{border-color:var(--canity-accent);color:#f4f0e8;background:rgba(12,14,19,.72);border-radius:12px}
  #stick i{background:var(--canity-accent);border-color:#e6ecf2;opacity:.65}
  #rhythmTouch{display:none;position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);gap:8px;z-index:8;pointer-events:auto}
  #rhythmTouch button{width:clamp(52px,12vw,82px);height:clamp(48px,13vh,72px);font-size:22px;touch-action:none}
  body.calibrating #rhythmTouch{display:flex}
  body.calibrating #movezone,body.calibrating #look,body.calibrating #stick,body.calibrating #btns,body.calibrating #btns2{display:none!important}
  body.touchmenu #touch{display:none!important}
  @media(pointer:coarse){#entry{display:none}#btns{grid-template-columns:repeat(3,min(13vw,58px));gap:6px}#btns2{grid-template-columns:repeat(3,min(13vw,58px));gap:6px}#btns button,#btns2 button{width:min(13vw,58px);height:min(13vw,58px);font-size:12px}}

  /* Touch hit layers are explicit: navigation zones cannot cover action buttons. */
  #touch { pointer-events: none; }
  #movezone, #look { z-index: 0; }
  #stick { z-index: 1; }
  #btns, #btns2 { z-index: 4; }
  #rhythmTouch { z-index: 20; }
  @media (pointer: coarse), (max-height: 520px) {
    #btns2 { grid-template-columns: repeat(4, clamp(40px, 8vw, 52px)); gap: 7px; }
    #btns2 button { width: clamp(40px, 8vw, 52px); height: clamp(40px, 12vh, 52px); font-size: 12px; }
    #btns { grid-template-columns: repeat(2, clamp(44px, 10vw, 60px)); gap: 8px; }
    #btns button { width: clamp(44px, 10vw, 60px); height: clamp(44px, 15vh, 60px); }
  }

  #menuNav {display:none;position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:19;gap:4px}
  body.touchmenu #menuNav {display:flex}
  #menuNav button,#screenTools button {background:#101d2deb;color:#e6f4ff;border:1px solid #7bacc8;border-radius:5px;min-width:40px;min-height:40px;font-size:17px;touch-action:none}
  #screenTools {pointer-events:auto;position:fixed;top:calc(3px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:100}
  #screenTools button {min-height:28px;font-size:12px;padding:3px 12px;opacity:.75}
  #canvas {cursor:default}
  @media (prefers-reduced-motion:reduce) {#boot {transition:none}}
#treeZoom{display:none;position:fixed;right:clamp(155px,25vw,290px);top:calc(8px + env(safe-area-inset-top,0px));z-index:21;gap:8px}
#treeZoom button{width:44px;height:40px;background:#102432eF;color:#e6f5ff;border:1px solid #7bc9e8;border-radius:5px;font-size:25px;touch-action:none}
#saveToggle{display:none;position:fixed;left:80px;top:4px;z-index:111;background:#142334;color:#daeaf5;border:1px solid #72accc;min-height:28px}
#entry{z-index:112}#saveSlotChoice{max-width:90px;background:#122334;color:white;min-height:30px}
@media(pointer:coarse){#saveToggle{display:block}#entry.saveopen{display:flex;left:5px;right:auto;bottom:55px;gap:4px;background:#091320;flex-wrap:wrap;max-width:90vw}}
body.touchControls #saveToggle{display:block}body.touchControls #entry.saveopen{display:flex}
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>

<div id="boot">
  <h1>CANITY</h1>
  <div class="sub">RAYCASTER HORROR</div>
  <div id="bar"><i></i></div>
  <div id="status">载入中…</div>
</div>

<div id="touch">
  <div id="movezone"></div>
  <div id="stick"><i></i></div>
  <div id="look"></div>

  <div id="btns">
    <button data-act="INTERACT">交互</button>
    <button data-act="SWING">蓄力/挥击</button>
    <button data-act="DODGE">挣脱/闪避</button>
    <button data-act="MENU_CONFIRM">确认</button>
    <button data-act="THROW">投掷</button>
  </div>

  <div id="btns2">
    <button data-act="MAP">地图</button>
    <button data-act="FLASHLIGHT">手电</button>
    <button data-act="CRANK">摇电</button>
    <button data-act="PAUSE">菜单</button>
    <button data-vk="84">补给</button><button data-vk="81">相位</button><button data-vk="71">静息</button><button data-act="SPRINT">冲刺</button>
  </div>
</div>

<div id="rhythmTouch"><button data-vk="81">Q</button><button data-vk="87">W</button><button data-vk="69">E</button><button data-vk="82">R</button><button data-vk="27">退出</button></div>
<div id="rotate">
  <div class="icon">⟳</div>
  <div>请把手机横过来玩</div>
  <div style="color:#6f7d90;font-size:12px">横屏后画面才会铺满</div>
  <a class="lnk" href="javascript:void(0)" id="rotBtn">点我尝试自动横屏</a>
</div>

<button id="saveToggle" type="button">存档</button>
<div id="entry">
<select id="saveSlotChoice" aria-label="存档槽"><option value="-1">当前槽</option><option value="0">槽0</option><option value="1">槽1</option><option value="2">槽2</option></select>
  <a class="primary" href="https://github.com/sakurapipi/CANITY/releases/latest">下载完整版 (Windows)</a>
  <a href="javascript:void(0)" id="savExport">导出存档</a>
  <a href="javascript:void(0)" id="savImport">导入存档</a>
  <input type="file" id="savFile" accept=".sav,application/octet-stream"
         style="display:none">
</div>

<div id="screenTools"><button id="fullscreenBtn" type="button">全屏 / 窗口</button><button id="mapClose" data-act="MAP" type="button" style="display:none">收起地图</button></div>
<div id="treeZoom" aria-label="技能树缩放"><button data-tree-zoom="1">+</button><button data-tree-zoom="-1">−</button></div>
<div id="menuNav" aria-label="菜单导航">
<button data-menu-key="27">返回</button><button data-menu-key="37">←</button><button data-menu-key="38">↑</button><button data-menu-key="40">↓</button><button data-menu-key="39">→</button><button data-menu-key="13">确认</button>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    _usingTouch:location.search.indexOf('touch=1')>=0 || (window.matchMedia('(pointer:coarse)').matches && !window.matchMedia('(hover:hover)').matches),
    print: function () {},
    printErr: function (t) { console.error(t); },
    setStatus: function (t) {
      var el = document.getElementById('status');
      if (el) el.textContent = t || '载入中…';
    },
    onRuntimeInitialized: function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('hidden');
      if (Module.canvas) Module.canvas.focus();
    },
    locateFile: function (path) { return path; }
  };
  // ==================================================================
  // 存档导出 / 导入（v2.4.2 / B4）
  // ------------------------------------------------------------------
  // 网页端存档就是 localStorage 里的 base64 —— 解出来就是**原始 CSAV 字节**，
  // 和桌面版的 canity0.sav 完全同构。所以不需要经过 C 层：
  // 导出的文件可以直接丢进桌面版存档目录，反之亦然。
  //
  // 安全原则：导入之前先把现有存档复制成 .bak。
  // 导入的是坏档时，游戏自己的"坏档不覆盖"逻辑会回退 .bak。
  // ==================================================================
  (function () {
    function saveKeys(){
      var select=document.getElementById('saveSlotChoice'),chosen=select?Number(select.value):-1;
      var slot=chosen>=0?chosen:(Module._CanityWebSaveSlot?Module._CanityWebSaveSlot():0);
      if(slot<0 || slot>2)slot=0;var key='canity:canity'+slot+'.sav';
      return {slot:slot,key:key,time:key+'#ts',backup:key+'.bak',backupTime:key+'.bak#ts'};
    }

    function b64ToBytes(b64) {
      var bin = atob(b64);
      var out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function bytesToB64(arr) {
      var s = '';
      for (var i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
      return btoa(s);
    }

    /* 返回当前存档的原始字节（没有存档返回 null）。测试直接调它。 */
    function exportBytes() {
      var v = localStorage.getItem(saveKeys().key);
      if (!v) return null;
      return b64ToBytes(v);
    }

    /* 写入存档字节。返回：
         1  成功（并已备份旧档）
         0  成功（原本没有旧档）
        -1  不是可识别的存档（不写入）
        -2  浏览器存储失败（配额 / 隐私模式） */
    function importBytes(arr) {
      var k=saveKeys(),KEY=k.key,TS=k.time,BAK=k.backup,BAK_TS=k.backupTime;
      if (!arr || arr.length < 16) return -1;
      /* 只做最外层的魔数检查：CSAV 信封 或 裸档 'CAN2'/'2NAC' */
      var m = String.fromCharCode(arr[0], arr[1], arr[2], arr[3]);
      var ok = (m === 'CSAV') ||
               (m === 'CAN2') || (m === '2NAC') || (m === 'CANT');
      if (!ok) return -1;
      try {
        var had = localStorage.getItem(KEY);
        if (had) {
          localStorage.setItem(BAK, had);
          localStorage.setItem(BAK_TS,
            localStorage.getItem(TS) || String(Date.now()));
        }
        localStorage.setItem(KEY, bytesToB64(arr));
        localStorage.setItem(TS, String(Date.now()));
        return had ? 1 : 0;
      } catch (e) {
        return -2;
      }
    }

    /* ---- 供自动化测试调用 ---- */
    window.__canityExportBytes = exportBytes;
    window.__canityImportBytes = importBytes;

    /* ---- 界面 ---- */
    var eBtn = document.getElementById('savExport');
    var iBtn = document.getElementById('savImport');
    var file = document.getElementById('savFile');

    function toast(msg) {
      var el = document.getElementById('status');
      if (el) { el.textContent = msg; el.style.color = '#e8c040'; }
    }

    if (eBtn) eBtn.addEventListener('click', function () {
      var b = exportBytes();
      if (!b) { toast('还没有存档可导出'); return; }
      var blob = new Blob([b], { type: 'application/octet-stream' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'canity'+saveKeys().slot+'.sav';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { document.body.removeChild(a); }, 200);
      toast('已导出当前选择的存档');
    });

    if (iBtn && file) {
      iBtn.addEventListener('click', function () { file.click(); });
      file.addEventListener('change', function () {
        var f = file.files && file.files[0];
        if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          var arr = new Uint8Array(rd.result);
          var r = importBytes(arr);
          if (r === -1) { toast('这不是 CANITY 存档（魔数不符）'); return; }
          if (r === -2) { toast('浏览器拒绝写入（存储已满或隐私模式）'); return; }
          toast('存档已导入，正在重新载入…');
          setTimeout(function () { location.reload(); }, 600);
        };
        rd.readAsArrayBuffer(f);
      });
    }
  })();

  // ==================================================================
  // 竖屏守卫 + 自动横屏（2026-11-06 第二版）
  // ------------------------------------------------------------------
  // 用户实测（iPhone 13 Pro Max）：「打开的时候屏幕不够用」。
  // 第一人称横向视野在竖屏下只有窄窄一条，没法玩。
  // 所以：手机竖屏时盖一层提示，点一下尝试全屏 + 锁定横屏。
  // ==================================================================
  (function () {
    var forced = (location.search || '').indexOf('touch=1') >= 0;
    var isTouch = forced || Module._usingTouch;
    if (!isTouch) return;
    var box = document.getElementById('rotate');
    var btn = document.getElementById('rotBtn');
    if (!box) return;

    function portrait() {
      return window.innerHeight > window.innerWidth * 1.02;
    }
    function update() {
      if (portrait()) box.classList.add('on');
      else box.classList.remove('on');
    }
    update();
    window.addEventListener('resize', update, false);
    window.addEventListener('orientationchange', function () {
      setTimeout(update, 250);
    }, false);

    function tryLandscape() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        try { var promise=req.call(el);if(promise && promise.catch)promise.catch(function(){}); } catch (e) { /* Unsupported: retain windowed play. */ }
      }
      if (screen.orientation && screen.orientation.lock) {
        try { var lock=screen.orientation.lock('landscape');if(lock && lock.catch)lock.catch(function(){}); } catch(ignored) {}
      }
      setTimeout(update, 400);
    }
    if (btn) btn.addEventListener('click', tryLandscape, false);
    box.addEventListener('click', tryLandscape, false);
  })();

  // ==================================================================
  // 触屏操作（2026-11-06 R8）
  // ------------------------------------------------------------------
  // 直接往 Module._keys 写 Windows 虚拟键码 —— 与键盘走同一条通道，
  // 游戏侧完全不知道输入来自触摸屏还是键盘。
  //   W/A/S/D = 87/65/83/68     E=69  V=86  空=32  M=77  右键=2
  // ==================================================================
  (function () {
    // ?touch=1 可以强制打开，方便在桌面上调试触屏布局
    var forceTouch = (location.search || '').indexOf('touch=1') >= 0;
    var touchable = forceTouch || Module._usingTouch;
    var layer = document.getElementById('touch');
    if (!layer) return;
    if(touchable)layer.classList.add('on');
    Module._touchResetHandlers=[];

    /* ==================================================================
     * 触屏按键的两条规则（2026-11-06 第二版）
     * ------------------------------------------------------------------
     * ① 短按不能被吞：轮询式输入里"按下+松开"若落在同一帧，
     *    主循环永远看不到。所以松开后**延后 90ms 再清**。
     * ② 按住不能被误清：上一版按下后 120ms 无条件清零，
     *    结果「摇电」「疾跑」这种需要按住的操作 120ms 就断了 ——
     *    用户实测「摇电没有用」就是这个。
     * ================================================================== */
    Module._held = Module._held || {};
    function key(vk, on) {
      if (!Module._keys) return;
      if (on) {
        Module._held[vk] = 1;
        if(!Module._keys[vk] && Module._keyPulses)Module._keyPulses[vk]=1;
        Module._keys[vk] = 1;
      } else {
        Module._held[vk] = 0;
        clearTimeout(Module['_kt' + vk]);
        Module['_kt' + vk] = setTimeout(function () {
          if (!Module._held[vk]) Module._keys[vk] = 0;
        }, 90);
      }
    }
    Module._key = key;

    // 右侧半屏拖动 = 转视角
    var look = document.getElementById('look');
    var lookId = null, lastX = 0;
    function ended(e,id){if(id===null)return false;for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===id)return true;return false;}
    look.addEventListener('touchstart', function (e) {
      if(lookId!==null)return;
      var t = e.changedTouches[0];
      lookId = t.identifier; lastX = t.clientX;
      Module._touchLook = true;
      e.preventDefault();
    }, { passive: false });
    look.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== lookId) continue;
        var dx = t.clientX - lastX;
        lastX = t.clientX;
        Module._mouseDX = (Module._mouseDX || 0) + dx * 2;
        Module._mouseDY = 0; // Vertical look intentionally disabled.
      }
      e.preventDefault();
    }, { passive: false });
    function endLook(e){if(ended(e,lookId)){lookId=null;Module._touchLook=false;}}
    look.addEventListener('touchend',endLook,false);look.addEventListener('touchcancel',endLook,false);

    // ==================================================================
    // 左半屏移动区（v5）
    // ------------------------------------------------------------------
