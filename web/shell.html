<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>CANITY — 浏览器版</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a; color: #c8d0dc;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;          /* letterbox 由 CSS 负责，不拉伸 */
    image-rendering: pixelated;   /* 像素风：放大不糊 */
    background: #000;
    cursor: default;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; background: #05070a; z-index: 10;
    transition: opacity .35s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot h1 {
    margin: 0; font-size: clamp(28px, 7vw, 64px);
    letter-spacing: .34em; color: #e8c040; font-weight: 700;
  }
  #boot .sub { color: #6f7d90; letter-spacing: .18em; font-size: clamp(10px, 2.4vw, 14px); }
  #bar { width: min(420px, 70vw); height: 4px; background: #141a22; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0%; background: #e8c040; transition: width .2s; }
  #status { color: #8b98a8; font-size: 12px; letter-spacing: .1em; }
  #entry {
    position: fixed; right: 16px; bottom: 14px; z-index: 11;
    display: flex; gap: 10px; align-items: center;
    font-size: 12px; letter-spacing: .08em;
  }
  #entry a {
    color: #9fb0c4; text-decoration: none;
    border: 1px solid #2a3542; padding: 7px 12px; border-radius: 3px;
    background: rgba(10,16,22,.82);
  }
  #entry a:hover { color: #e8c040; border-color: #4a5a6c; }
  #entry a.primary { color: #e8c040; border-color: #6a5a20; }

  /* ==================================================================
   * 触屏操作层（2026-11-06 第二版）
   * ------------------------------------------------------------------
   * 用户实测（iPhone 13 Pro Max）：
   *   「左边移动键是对的，但右边四个按键导致我划不到屏幕」
   * 原因：拖拽转视角的区域（#look）铺满右侧整屏，而按钮压在它上面，
   *       手指一碰按钮就吃掉了拖拽。
   *
   * 现在把屏幕**分区**，互不重叠：
   *   左下 摇杆          右下 按钮簇（只占底部 180px）
   *   右中上 拖拽区      顶部 留给 HUD
   * 另外全部尺寸用 min() 跟着屏幕缩放，横屏时按钮不至于太大。
   * ================================================================== */
  #touch { position: fixed; inset: 0; z-index: 12; display: none; pointer-events: none; }
  #touch.on { display: block; }

  #stick {
    position: absolute;
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: min(30vw, 132px); height: min(30vw, 132px);
    border-radius: 50%;
    border: 1px solid #2f3a48;
    background: rgba(12,18,24,.38);
    pointer-events: auto; touch-action: none;
  }
  #stick > i {
    position: absolute; left: 50%; top: 50%;
    width: 42%; height: 42%; margin: -21% 0 0 -21%;
    border-radius: 50%; background: rgba(232,192,64,.26);
    border: 1px solid #6a5a20;
  }

  /* 拖拽转视角：只占右半屏的**中间偏上**，底部让给按钮 */
  #look {
    position: absolute;
    right: 0; top: 0;
    width: 52%;
    height: calc(100% - 172px);
    pointer-events: auto; touch-action: none;
  }

  #btns {
    position: absolute;
    right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: grid;
    grid-template-columns: repeat(2, min(16vw, 66px));
    gap: 8px;
    pointer-events: none;
  }
  #btns button {
    width: min(16vw, 66px); height: min(16vw, 66px);
    border-radius: 50%;
    border: 1px solid #3a4656; background: rgba(14,20,28,.66);
    color: #cfd8e4; font: 600 14px/1 ui-monospace, monospace;
    pointer-events: auto; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #btns button:active { background: rgba(232,192,64,.26); color: #e8c040; }
  #btns button.wide {
    grid-column: span 2; width: auto; border-radius: 12px;
    height: min(11vw, 46px);
  }

  /* 竖屏提示：手机上竖着拿根本看不清，直接让用户横过来 */
  #rotate {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: #05070a; color: #c8d0dc;
    font: 600 15px/1.9 ui-monospace, monospace; text-align: center;
  }
  #rotate.on { display: flex; }

  /* 触屏横屏时，下载入口移到右上角并缩小 ——
     原来贴右下角，正好压在「投掷」按钮上。 */
  @media (pointer: coarse), (max-height: 520px) {
    #entry {
      right: 10px; bottom: auto; top: 8px;
      font-size: 10px;
    }
    #entry a { padding: 5px 9px; }
  }
  #rotate .icon { font-size: 46px; color: #e8c040; }
  #rotate .lnk {
    margin-top: 6px; padding: 9px 16px; border-radius: 4px;
    border: 1px solid #3a4656; color: #9fb0c4; text-decoration: none;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>

<div id="boot">
  <h1>CANITY</h1>
  <div class="sub">RAYCASTER HORROR</div>
  <div id="bar"><i></i></div>
  <div id="status">载入中…</div>
</div>

<div id="touch">
  <div id="stick"><i></i></div>
  <div id="look"></div>
  <div id="btns">
    <button data-key="69">E</button>
    <button data-key="86">V</button>
    <button data-key="32">空</button>
    <button data-key="77">M</button>
    <button class="wide" data-key="2">投掷</button>
  </div>
</div>

<div id="rotate">
  <div class="icon">⟳</div>
  <div>请把手机横过来玩</div>
  <div style="color:#6f7d90;font-size:12px">横屏后画面才会铺满</div>
  <a class="lnk" href="javascript:void(0)" id="rotBtn">点我尝试自动横屏</a>
</div>

<div id="entry">
  <a class="primary" href="https://github.com/sakurapipi/CANITY/releases/latest">下载完整版 (Windows)</a>
</div>

<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function () {},
    printErr: function (t) { console.error(t); },
    setStatus: function (t) {
      var el = document.getElementById('status');
      if (el) el.textContent = t || '载入中…';
    },
    onRuntimeInitialized: function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('hidden');
      if (Module.canvas) Module.canvas.focus();
    },
    locateFile: function (path) { return path; }
  };
  // ==================================================================
  // 竖屏守卫 + 自动横屏（2026-11-06 第二版）
  // ------------------------------------------------------------------
  // 用户实测（iPhone 13 Pro Max）：「打开的时候屏幕不够用」。
  // 第一人称横向视野在竖屏下只有窄窄一条，没法玩。
  // 所以：手机竖屏时盖一层提示，点一下尝试全屏 + 锁定横屏。
  // ==================================================================
  (function () {
    var forced = (location.search || '').indexOf('touch=1') >= 0;
    var isTouch = forced || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouch) return;
    var box = document.getElementById('rotate');
    var btn = document.getElementById('rotBtn');
    if (!box) return;

    function portrait() {
      return window.innerHeight > window.innerWidth * 1.02;
    }
    function update() {
      if (portrait()) box.classList.add('on');
      else box.classList.remove('on');
    }
    update();
    window.addEventListener('resize', update, false);
    window.addEventListener('orientationchange', function () {
      setTimeout(update, 250);
    }, false);

    function tryLandscape() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        try { req.call(el); } catch (e) { /* iOS 上可能直接拒绝 */ }
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function () {});
      }
      setTimeout(update, 400);
    }
    if (btn) btn.addEventListener('click', tryLandscape, false);
    box.addEventListener('click', tryLandscape, false);
  })();

  // ==================================================================
  // 触屏操作（2026-11-06 R8）
  // ------------------------------------------------------------------
  // 直接往 Module._keys 写 Windows 虚拟键码 —— 与键盘走同一条通道，
  // 游戏侧完全不知道输入来自触摸屏还是键盘。
  //   W/A/S/D = 87/65/83/68     E=69  V=86  空=32  M=77  右键=2
  // ==================================================================
  (function () {
    // ?touch=1 可以强制打开，方便在桌面上调试触屏布局
    var forceTouch = (location.search || '').indexOf('touch=1') >= 0;
    var touchable = forceTouch ||
                    ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!touchable) return;
    var layer = document.getElementById('touch');
    if (!layer) return;
    layer.classList.add('on');

    function key(vk, on) {
      if (!Module._keys) return;
      Module._keys[vk] = on ? 1 : 0;
    }

    // 右侧半屏拖动 = 转视角
    var look = document.getElementById('look');
    var lookId = null, lastX = 0;
    look.addEventListener('touchstart', function (e) {
      var t = e.changedTouches[0];
      lookId = t.identifier; lastX = t.clientX;
      Module._touchLook = true;
      e.preventDefault();
    }, { passive: false });
    look.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== lookId) continue;
        var dx = t.clientX - lastX;
        lastX = t.clientX;
        Module._mouseDX = (Module._mouseDX || 0) + dx * 2;
      }
      e.preventDefault();
    }, { passive: false });
    look.addEventListener('touchend', function () {
      lookId = null; Module._touchLook = false;
    }, false);

    // 左下摇杆 = 移动
    var stick = document.getElementById('stick');
    var knob = stick.querySelector('i');
    var stickId = null, cx = 0, cy = 0, R = 56;
    function clearMove() { key(87, 0); key(83, 0); key(65, 0); key(68, 0); }
    function applyMove(dx, dy) {
      clearMove();
      var dead = 14;
      if (dy < -dead) key(87, 1);
      if (dy > dead) key(83, 1);
      if (dx < -dead) key(65, 1);
      if (dx > dead) key(68, 1);
    }
    stick.addEventListener('touchstart', function (e) {
      var t = e.changedTouches[0];
      var r = stick.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      stickId = t.identifier;
      e.preventDefault();
    }, { passive: false });
    stick.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== stickId) continue;
        var dx = t.clientX - cx, dy = t.clientY - cy;
        var len = Math.sqrt(dx * dx + dy * dy) || 1;
        var k = Math.min(1, R / len);
        knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
        applyMove(dx, dy);
      }
      e.preventDefault();
    }, { passive: false });
    stick.addEventListener('touchend', function () {
      stickId = null;
      knob.style.transform = '';
      clearMove();
    }, false);

    // 动作按钮
    Array.prototype.forEach.call(document.querySelectorAll('#btns button'), function (b) {
      var vk = parseInt(b.getAttribute('data-key'), 10);
      b.addEventListener('touchstart', function (e) { key(vk, 1); e.preventDefault(); }, { passive: false });
      b.addEventListener('touchend', function (e) { key(vk, 0); e.preventDefault(); }, { passive: false });
      b.addEventListener('touchcancel', function () { key(vk, 0); }, false);
    });
  })();

  // ==================================================================
  // file:// 守卫（2026-11-06）
  // ------------------------------------------------------------------
  // 双击 index.html 打开时，浏览器会用 file:// 协议，
  // fetch(index.wasm) 被 CORS 拦掉 —— 页面会一直卡在"载入中…"，
  // 而且控制台里只有一条不起眼的 CORS 报错。
  // 这是玩家最可能踩的坑，所以直接给一句能照做的话。
  // ==================================================================
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      var b = document.getElementById('boot');
      if (b) b.classList.remove('hidden');
      var s = document.getElementById('status');
      if (s) {
        s.style.color = '#ff6b5a';
        s.style.maxWidth = '80vw';
        s.style.textAlign = 'center';
        s.style.lineHeight = '1.9';
        s.innerHTML =
          '不能直接双击打开（file:// 会被浏览器拦掉 wasm）<br>' +
          '在 dist 目录开一个本地服务再访问：<br>' +
          '<b style="color:#e8c040">python -m http.server 8080</b><br>' +
          '然后打开 <b style="color:#e8c040">http://127.0.0.1:8080/</b>';
      }
      var bar = document.querySelector('#bar > i');
      if (bar) { bar.style.background = '#ff6b5a'; bar.style.width = '100%'; }
    });
    window.__canityFileGuard = true;
  }

  // ==================================================================
  // 错误上屏（2026-11-06）
  // ------------------------------------------------------------------
  // 网页版出问题时，控制台在手机上根本看不到。把错误直接画到加载层里，
  // 用户截一张图就能把问题描述清楚，我也能直接定位。
  // ==================================================================
  window.__canityFail = function (msg) {
    try {
      var b = document.getElementById('boot');
      var s = document.getElementById('status');
      if (b) { b.classList.remove('hidden'); b.style.display = 'flex'; }
      if (s) { s.textContent = String(msg).slice(0, 220); s.style.color = '#ff6b5a'; }
      var bar = document.querySelector('#bar > i');
      if (bar) bar.style.background = '#ff6b5a';
    } catch (e) { /* 连错误显示都失败就算了 */ }
  };
  window.addEventListener('error', function (e) {
    window.__canityFail('JS ERROR: ' + (e.message || e.type) +
                        (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__canityFail('PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // 进度条：Emscripten 的 download 进度靠 XHR 包装，这里给个粗粒度回退
  (function () {
    var bar = document.querySelector('#bar > i');
    var fake = 0;
    var timer = setInterval(function () {
      fake = Math.min(92, fake + (92 - fake) * 0.06 + 0.4);
      if (bar) bar.style.width = fake.toFixed(1) + '%';
      if (Module.calledRun) {
        if (bar) bar.style.width = '100%';
        clearInterval(timer);
      }
    }, 120);
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
