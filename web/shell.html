<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>CANITY — 浏览器版</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070a; color: #c8d0dc;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;          /* letterbox 由 CSS 负责，不拉伸 */
    image-rendering: pixelated;   /* 像素风：放大不糊 */
    background: #000;
    cursor: default;
    touch-action: none;
  }
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; background: #05070a; z-index: 10;
    transition: opacity .35s ease;
  }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #boot h1 {
    margin: 0; font-size: clamp(28px, 7vw, 64px);
    letter-spacing: .34em; color: #e8c040; font-weight: 700;
  }
  #boot .sub { color: #6f7d90; letter-spacing: .18em; font-size: clamp(10px, 2.4vw, 14px); }
  #bar { width: min(420px, 70vw); height: 4px; background: #141a22; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0%; background: #e8c040; transition: width .2s; }
  #status { color: #8b98a8; font-size: 12px; letter-spacing: .1em; }
  #entry {
    position: fixed; right: 16px; bottom: 14px; z-index: 11;
    display: flex; gap: 10px; align-items: center;
    font-size: 12px; letter-spacing: .08em;
  }
  #entry a {
    color: #9fb0c4; text-decoration: none;
    border: 1px solid #2a3542; padding: 7px 12px; border-radius: 3px;
    background: rgba(10,16,22,.82);
  }
  #entry a:hover { color: #e8c040; border-color: #4a5a6c; }
  #entry a.primary { color: #e8c040; border-color: #6a5a20; }

  /* 触屏操作层 v5：左半屏移动 + 右半屏视角 + 7 个按钮 */
  #touch { position: fixed; inset: 0; z-index: 12; display: none; }
  #touch.on { display: block; }
  #touch > * { pointer-events: none; }

  #movezone { position: absolute; left: 0; top: 0; width: 46%; height: 100%;
              pointer-events: auto; touch-action: none; }
  #look     { position: absolute; right: 0; top: 0; width: 54%; height: 100%;
              pointer-events: auto; touch-action: none; }

  #stick {
    position: absolute; display: none;
    width: 116px; height: 116px; margin: -58px 0 0 -58px;
    border-radius: 50%;
    border: 1px solid rgba(120,140,165,.45);
    background: rgba(12,18,24,.18);
    pointer-events: none;
  }
  #stick.on { display: block; }
  #stick > i {
    position: absolute; left: 50%; top: 50%;
    width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: rgba(232,192,64,.22);
    border: 1px solid rgba(200,170,80,.60);
  }

  #btns, #btns2 {
    position: absolute;
    right: calc(12px + env(safe-area-inset-right, 0px));
    display: grid; gap: 10px;
    pointer-events: none;
  }
  #btns  { bottom: calc(12px + env(safe-area-inset-bottom, 0px));
           grid-template-columns: repeat(2, min(15vw, 62px)); }
  #btns2 { top: calc(10px + env(safe-area-inset-top, 0px));
           grid-template-columns: repeat(2, min(15vw, 62px)); }

  #btns button, #btns2 button {
    width: min(15vw, 62px); height: min(15vw, 62px);
    border-radius: 50%;
    border: 1px solid rgba(120,140,165,.42);
    background: rgba(14,20,28,.30);
    color: rgba(207,216,228,.85);
    font: 600 13px/1.2 ui-monospace, monospace;
    pointer-events: auto; touch-action: none;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  #btns button:active, #btns2 button:active {
    background: rgba(232,192,64,.32); color: #ffe27a;
    border-color: rgba(232,192,64,.75);
  }

  /* 竖屏提示：手机上竖着拿根本看不清，直接让用户横过来 */
  #rotate {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: #05070a; color: #c8d0dc;
    font: 600 15px/1.9 ui-monospace, monospace; text-align: center;
  }
  #rotate.on { display: flex; }

  /* 触屏横屏时，下载入口移到右上角并缩小 ——
     原来贴右下角，正好压在「投掷」按钮上。 */
  @media (pointer: coarse), (max-height: 520px) {
    /* 挪到**左上**：右上角被手电/暂停两个按钮占了 */
    #entry {
      right: auto; bottom: auto;
      left: calc(8px + env(safe-area-inset-left, 0px));
      top: calc(6px + env(safe-area-inset-top, 0px));
      font-size: 9px; opacity: .55;
    }
    #entry a { padding: 4px 8px; }
  }
  #rotate .icon { font-size: 46px; color: #e8c040; }
  #rotate .lnk {
    margin-top: 6px; padding: 9px 16px; border-radius: 4px;
    border: 1px solid #3a4656; color: #9fb0c4; text-decoration: none;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>

<div id="boot">
  <h1>CANITY</h1>
  <div class="sub">RAYCASTER HORROR</div>
  <div id="bar"><i></i></div>
  <div id="status">载入中…</div>
</div>

<div id="touch">
  <div id="movezone"></div>
  <div id="stick"><i></i></div>
  <div id="look"></div>

  <div id="btns">
    <button data-act="INTERACT">交互</button>
    <button data-act="SWING">挥击</button>
    <button data-act="MENU_CONFIRM">确认</button>
    <button data-act="THROW">投掷</button>
  </div>

  <div id="btns2">
    <button data-act="MAP">地图</button>
    <button data-act="FLASHLIGHT">手电</button>
    <button data-act="CRANK">摇电</button>
    <button data-act="PAUSE">菜单</button>
  </div>
</div>

<div id="rotate">
  <div class="icon">⟳</div>
  <div>请把手机横过来玩</div>
  <div style="color:#6f7d90;font-size:12px">横屏后画面才会铺满</div>
  <a class="lnk" href="javascript:void(0)" id="rotBtn">点我尝试自动横屏</a>
</div>

<div id="entry">
  <a class="primary" href="https://github.com/sakurapipi/CANITY/releases/latest">下载完整版 (Windows)</a>
</div>

<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function () {},
    printErr: function (t) { console.error(t); },
    setStatus: function (t) {
      var el = document.getElementById('status');
      if (el) el.textContent = t || '载入中…';
    },
    onRuntimeInitialized: function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('hidden');
      if (Module.canvas) Module.canvas.focus();
    },
    locateFile: function (path) { return path; }
  };
  // ==================================================================
  // 竖屏守卫 + 自动横屏（2026-11-06 第二版）
  // ------------------------------------------------------------------
  // 用户实测（iPhone 13 Pro Max）：「打开的时候屏幕不够用」。
  // 第一人称横向视野在竖屏下只有窄窄一条，没法玩。
  // 所以：手机竖屏时盖一层提示，点一下尝试全屏 + 锁定横屏。
  // ==================================================================
  (function () {
    var forced = (location.search || '').indexOf('touch=1') >= 0;
    var isTouch = forced || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouch) return;
    var box = document.getElementById('rotate');
    var btn = document.getElementById('rotBtn');
    if (!box) return;

    function portrait() {
      return window.innerHeight > window.innerWidth * 1.02;
    }
    function update() {
      if (portrait()) box.classList.add('on');
      else box.classList.remove('on');
    }
    update();
    window.addEventListener('resize', update, false);
    window.addEventListener('orientationchange', function () {
      setTimeout(update, 250);
    }, false);

    function tryLandscape() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        try { req.call(el); } catch (e) { /* iOS 上可能直接拒绝 */ }
      }
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function () {});
      }
      setTimeout(update, 400);
    }
    if (btn) btn.addEventListener('click', tryLandscape, false);
    box.addEventListener('click', tryLandscape, false);
  })();

  // ==================================================================
  // 触屏操作（2026-11-06 R8）
  // ------------------------------------------------------------------
  // 直接往 Module._keys 写 Windows 虚拟键码 —— 与键盘走同一条通道，
  // 游戏侧完全不知道输入来自触摸屏还是键盘。
  //   W/A/S/D = 87/65/83/68     E=69  V=86  空=32  M=77  右键=2
  // ==================================================================
  (function () {
    // ?touch=1 可以强制打开，方便在桌面上调试触屏布局
    var forceTouch = (location.search || '').indexOf('touch=1') >= 0;
    var touchable = forceTouch ||
                    ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!touchable) return;
    var layer = document.getElementById('touch');
    if (!layer) return;
    layer.classList.add('on');

    /* ==================================================================
     * 触屏按键的两条规则（2026-11-06 第二版）
     * ------------------------------------------------------------------
     * ① 短按不能被吞：轮询式输入里"按下+松开"若落在同一帧，
     *    主循环永远看不到。所以松开后**延后 90ms 再清**。
     * ② 按住不能被误清：上一版按下后 120ms 无条件清零，
     *    结果「摇电」「疾跑」这种需要按住的操作 120ms 就断了 ——
     *    用户实测「摇电没有用」就是这个。
     * ================================================================== */
    Module._held = Module._held || {};
    function key(vk, on) {
      if (!Module._keys) return;
      if (on) {
        Module._held[vk] = 1;
        Module._keys[vk] = 1;
      } else {
        Module._held[vk] = 0;
        clearTimeout(Module['_kt' + vk]);
        Module['_kt' + vk] = setTimeout(function () {
          if (!Module._held[vk]) Module._keys[vk] = 0;
        }, 90);
      }
    }
    Module._key = key;

    // 右侧半屏拖动 = 转视角
    var look = document.getElementById('look');
    var lookId = null, lastX = 0;
    look.addEventListener('touchstart', function (e) {
      var t = e.changedTouches[0];
      lookId = t.identifier; lastX = t.clientX;
      Module._touchLook = true;
      e.preventDefault();
    }, { passive: false });
    look.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.identifier !== lookId) continue;
        var dx = t.clientX - lastX;
        lastX = t.clientX;
        Module._mouseDX = (Module._mouseDX || 0) + dx * 2;
      }
      e.preventDefault();
    }, { passive: false });
    look.addEventListener('touchend', function () {
      lookId = null; Module._touchLook = false;
    }, false);

    // ==================================================================
    // 左半屏移动区（v5）
    // ------------------------------------------------------------------
    // 用户实测：「移动键没有用」—— 118px 的小圆圈在手机上按不准。
    // 改成：手指按在左半屏**任意位置**，那个点就是摇杆中心，
    // 往哪拖就往哪走（手机 FPS 通行做法）。
    // ==================================================================
    var movezone = document.getElementById('movezone');
    var stickEl = document.getElementById('stick');
    var knob = stickEl ? stickEl.querySelector('i') : null;
    var moveId = null, originX = 0, originY = 0;
    var STICK_R = 46;

    function clearMove() {
      key(87, 0); key(83, 0); key(65, 0); key(68, 0);
      moveState.up = moveState.down = moveState.left = moveState.right = 0;
    }
    /* 2026-11-06（用户实测：**移动一卡一卡**）
       原来每次 touchmove 都无条件重写 4 个键，手指在死区边缘抖动时
       keys 会反复 0/1 翻转 -> 走一下停一下。
       现在：① 死区带回滞（进入 14、退出 7）② 只有状态真的变了才写。 */
    var moveState = { up: 0, down: 0, left: 0, right: 0 };
    function setMove(vk, cur, next) {
      if (cur === next) return cur;
      key(vk, next ? 1 : 0);
      return next;
    }
    function axis(pos, neg, d) {
      /* 上下各用一个回滞阈值 */
      if (d < -14) return 1;
      if (d > -7)  return 0;
      return pos;
    }
    function applyMove(dx, dy) {
      var up, down;
      // 前：负 dy
      if (dy < -14) up = 1; else if (dy > -7) up = 0; else up = moveState.up;
      if (dy > 14) down = 1; else if (dy < 7) down = 0; else down = moveState.down;
      var left, right;
      if (dx < -14) left = 1; else if (dx > -7) left = 0; else left = moveState.left;
      if (dx > 14) right = 1; else if (dx < 7) right = 0; else right = moveState.right;

      moveState.up    = setMove(87, moveState.up, up);
      moveState.down  = setMove(83, moveState.down, down);
      moveState.left  = setMove(65, moveState.left, left);
      moveState.right = setMove(68, moveState.right, right);
    }
    function moveStickKnob(dx, dy) {
      if (!knob) return;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var k = Math.min(1, STICK_R / len);
      knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
    }

    if (movezone) {
      movezone.addEventListener('touchstart', function (e) {
        var t = e.changedTouches[0];
        moveId = t.identifier;
        originX = t.clientX; originY = t.clientY;
        if (stickEl) {
          stickEl.style.left = originX + 'px';
          stickEl.style.top = originY + 'px';
          stickEl.classList.add('on');
        }
        /* 按下即生效：以接触点为原点，此时位移为 0 —— 真正的方向由后续拖动给出 */
        applyMove(0, 0);
        moveStickKnob(0, 0);
        e.preventDefault();
      }, { passive: false });

      movezone.addEventListener('touchmove', function (e) {
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          if (t.identifier !== moveId) continue;
          var dx = t.clientX - originX;
          var dy = t.clientY - originY;
          applyMove(dx, dy);
          moveStickKnob(dx, dy);
        }
        e.preventDefault();
      }, { passive: false });

      function endMove(e) {
        moveId = null;
        clearMove();
        if (stickEl) stickEl.classList.remove('on');
        if (knob) knob.style.transform = '';
      }
      movezone.addEventListener('touchend', endMove, false);
      movezone.addEventListener('touchcancel', endMove, false);
    }

    // ==================================================================
    // 动作按钮（v2.4.2 / B4）
    // ------------------------------------------------------------------
    // 按钮上写的是**动作名**（data-act="INTERACT"），不是虚拟键码。
    // 启动时向 C 侧问一次当前绑定：CanityActionVk("INTERACT") -> 69。
    // 这样玩家在设置里改键之后，触屏按钮会自动跟着走。
    //
    // 问不到绑定（-1）就把按钮隐藏 —— 宁可少一个键，
    // 也不要让它指向一个错的键，那比没有更糟。
    // ==================================================================
    function resolveAct(b) {
      var name = b.getAttribute('data-act');
      if (!name) return -1;
      try {
        if (Module._CanityActionVk) {
          var vk = Module._CanityActionVk(allocUTF8(name));
          freeUTF8();
          return vk | 0;
        }
      } catch (err) { }
      return -1;
    }

    /* UTF8ToString 需要 C 侧分配；用 Module._malloc/_free 走一遍 */
    function allocUTF8(str) {
      var n = lengthBytesUTF8(str) + 1;
      var p = Module._malloc(n);
      stringToUTF8(str, p, n);
      Module.__lastStrPtr = p;
      return p;
    }
    function freeUTF8() {
      if (Module.__lastStrPtr) { Module._free(Module.__lastStrPtr); Module.__lastStrPtr = 0; }
    }

    /* 绑定在 C 侧是运行期状态（可能还没加载完），所以延迟解析：
       第一次触摸时再问，问到就缓存。 */
    Array.prototype.forEach.call(document.querySelectorAll('#btns button, #btns2 button'), function (b) {
      var name = b.getAttribute('data-act');
      if (!name) return;

      function vkOf() {
        /* 只缓存**成功**的解析结果。失败（Module 还没就绪 / 动作名写错）
           每次重试，避免第一次触摸太早把按钮永久钉死成不可用。 */
        if (b.__vk === undefined || b.__vk < 0) {
          var v = resolveAct(b);
          if (v >= 0) b.__vk = v;
          return v;
        }
        return b.__vk;
      }

      b.addEventListener('touchstart', function (e) {
        var vk = vkOf();
        if (vk < 0) return;
        key(vk, 1);
        e.preventDefault();
      }, { passive: false });
      b.addEventListener('touchend', function (e) {
        var vk = vkOf();
        if (vk >= 0) key(vk, 0);
        e.preventDefault();
      }, { passive: false });
      b.addEventListener('touchcancel', function () {
        var vk = vkOf();
        if (vk >= 0) key(vk, 0);
      }, false);
      /* 桌面浏览器用鼠标也能点（调试方便） */
      b.addEventListener('mousedown', function (e) {
        var vk = vkOf();
        if (vk >= 0) key(vk, 1);
      });
      b.addEventListener('mouseup', function (e) {
        var vk = vkOf();
        if (vk >= 0) key(vk, 0);
      });
    });

  })();

  // ==================================================================
  // file:// 守卫（2026-11-06）
  // ------------------------------------------------------------------
  // 双击 index.html 打开时，浏览器会用 file:// 协议，
  // fetch(index.wasm) 被 CORS 拦掉 —— 页面会一直卡在"载入中…"，
  // 而且控制台里只有一条不起眼的 CORS 报错。
  // 这是玩家最可能踩的坑，所以直接给一句能照做的话。
  // ==================================================================
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      var b = document.getElementById('boot');
      if (b) b.classList.remove('hidden');
      var s = document.getElementById('status');
      if (s) {
        s.style.color = '#ff6b5a';
        s.style.maxWidth = '80vw';
        s.style.textAlign = 'center';
        s.style.lineHeight = '1.9';
        s.innerHTML =
          '不能直接双击打开（file:// 会被浏览器拦掉 wasm）<br>' +
          '在 dist 目录开一个本地服务再访问：<br>' +
          '<b style="color:#e8c040">python -m http.server 8080</b><br>' +
          '然后打开 <b style="color:#e8c040">http://127.0.0.1:8080/</b>';
      }
      var bar = document.querySelector('#bar > i');
      if (bar) { bar.style.background = '#ff6b5a'; bar.style.width = '100%'; }
    });
    window.__canityFileGuard = true;
  }

  // ==================================================================
  // 错误上屏（2026-11-06）
  // ------------------------------------------------------------------
  // 网页版出问题时，控制台在手机上根本看不到。把错误直接画到加载层里，
  // 用户截一张图就能把问题描述清楚，我也能直接定位。
  // ==================================================================
  window.__canityFail = function (msg) {
    try {
      var b = document.getElementById('boot');
      var s = document.getElementById('status');
      if (b) { b.classList.remove('hidden'); b.style.display = 'flex'; }
      if (s) { s.textContent = String(msg).slice(0, 220); s.style.color = '#ff6b5a'; }
      var bar = document.querySelector('#bar > i');
      if (bar) bar.style.background = '#ff6b5a';
    } catch (e) { /* 连错误显示都失败就算了 */ }
  };
  window.addEventListener('error', function (e) {
    window.__canityFail('JS ERROR: ' + (e.message || e.type) +
                        (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.__canityFail('PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  // 进度条：Emscripten 的 download 进度靠 XHR 包装，这里给个粗粒度回退
  (function () {
    var bar = document.querySelector('#bar > i');
    var fake = 0;
    var timer = setInterval(function () {
      fake = Math.min(92, fake + (92 - fake) * 0.06 + 0.4);
      if (bar) bar.style.width = fake.toFixed(1) + '%';
      if (Module.calledRun) {
        if (bar) bar.style.width = '100%';
        clearInterval(timer);
      }
    }, 120);
  })();
</script>
