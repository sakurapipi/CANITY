name: CI

# 每个 push 和 PR 都跑编译 + 三条检查。
# Release 工作流也调用同一个 build_validate.py —— 让"发布"必须建立在"测试通过"上。
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Python 必须在 MSYS2 之前装好：setup-msys2 的 path-type: inherit 会把
      # 当前 PATH 带进 msys2 shell，python 才在那边可见。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSYS2 + MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # 先打印工具链，失败时一眼看出是环境问题还是代码问题
      - name: Toolchain diagnostic
        shell: msys2 {0}
        run: |
          echo "--- which ---"
          which python gcc windres || true
          echo "--- versions ---"
          python --version || true
          gcc --version | head -1 || true
          windres --version | head -1 || true

      # 源文件清单必须和磁盘一致（CI / Release / 本地同源）
      - name: Source list check
        shell: msys2 {0}
        run: python -X utf8 tools/build_sources.py --check

      # 编译 + test_canity + test_runtime + partition_check
      - name: Build and validate
        shell: msys2 {0}
        run: python -X utf8 tools/build_validate.py

      # ================================================================
      # 架构预算指标（第 1 轮加入，2026-11-08；第 7 轮改成阻塞）
      # ----------------------------------------------------------------
      # budget_check（单次改动涉及行数的中位数）现在**阻塞**：
      #   中位数 > 2500 行 = 一次改动要读太多东西，红。
      # module_cost 仍然只报告 —— ui(4,081) / render(4,283) 是有意保留的
      # （render 是每帧热点，ui 的 HUD 还没拆），拿它阻塞会让 CI 永远红。
      #
      # 三个指标回答同一个问题："改一次要读多少行"。
      # 详见 docs/架构重构方案_v2.md
      # ================================================================
      # ================================================================
      # 技能树布局自检（2026-11-08 第 5 轮加，**阻塞**）
      # ----------------------------------------------------------------
      # 从 skills.c 的半径表算出每个节点的屏幕坐标，断言：
      #   ① 默认缩放下全部可见（原来 30 个里 7 个在屏幕外）
      #   ② 没有明显重叠（面积占比 >= 8% 才算）
      # ================================================================
      - name: Skill tree layout (blocking)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -X utf8 tools/skill_layout_check.py

      - name: "Architecture budget (blocking: median commit size)"
        shell: pwsh
        run: |
          python -X utf8 tools/module_cost.py | Tee-Object -Variable mc | Out-Host
          python -X utf8 tools/budget_check.py --n 40 | Tee-Object -Variable bc | Out-Host
          $budget = $LASTEXITCODE
          if ($budget -ne 0) {
            Write-Error "One change now reads too much: the median commit touches more than 2500 lines (see docs/架构重构方案_v2.md)."
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Architecture budget"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $mc
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $bc
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      # 可复核性：证明产物真的存在且不是 0 字节
      - name: Artifact sanity
        shell: pwsh
        run: |
          $exe = Get-Item canity_verify.exe
          if ($exe.Length -lt 500KB) {
            Write-Error "canity.exe is suspiciously small: $($exe.Length) bytes"
            exit 1
          }
          "canity_verify.exe = {0:N0} bytes" -f $exe.Length
