name: Build and Release

# 触发条件：只有当推送以 v 开头的标签（比如 v2.4-alpha）时才运行
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # ================================================================
      # 2026-11-06：**发布必须建立在测试通过之上**。
      # 原来这里是手写 `gcc src/*.c src/save/*.c src/steam/*.c` ——
      # 上一个版本就漏过一次 src/save/。现在改成调用同一个
      # build_validate.py：编译 + test_canity + test_runtime + 分区检查
      # 任一失败，这个 job 就红，不会生成 Release。
      # ================================================================
      - name: Build and validate (gates the release)
        shell: msys2 {0}
        run: |
          python -X utf8 tools/build_sources.py --check
          python -X utf8 tools/build_validate.py
          cp canity_verify.exe canity.exe

      - name: Package files
        shell: pwsh
        run: |
          $ver = (Select-String -Path include/common.h -Pattern 'CANITY_VERSION_STR\s+"([^"]+)"').Matches[0].Groups[1].Value
          # 注意：必须写 ${ver}，写成 $ver_win64 会被 PowerShell 当成变量名 ver_win64（为空），
          # 结果包名变成 CANITY_v.zip，上传步骤的通配符就匹配不到。
          $name = "CANITY_v${ver}_win64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item canity.exe "$name/canity.exe"

          $readme = Get-Content docs/package_readme.txt -Raw -Encoding UTF8
          Set-Content -Path "$name/第一次运行请看.txt" -Value ($readme -replace '%VER%', $ver) -Encoding UTF8

          Copy-Item docs/解除锁定.bat "$name/解除锁定.bat"

          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: CANITY_v*_win64.zip
          generate_release_notes: true
          # v2.4-alpha / beta / rc 是预发布：releases/latest 不会指向它们。
          # 正式版标签（v2.4、v2.4.0、v2.3.9 这类不带后缀的）不勾。
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
