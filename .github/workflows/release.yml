name: Build and Release

# =====================================================================
# 2026-11-07（v2.4.2 / B5）：**一个提交、三个资产、同一份网页构建**
# ---------------------------------------------------------------------
# 原来的发布链有两个工作流：
#   release.yml  只产 Windows ZIP，web 附件靠人手传
#   pages.yml    自己再跑一遍 Emscripten 部署到 Pages
# 后果：
#   · Release 里的 web.zip / 单文件 HTML 不是 CI 产物（无法从标签复现）
#   · 线上 Pages 和下载到的 web.zip 来自**两次不同编译**
#
# 现在合成一个工作流：
#   windows job  -> 编译 + 验证 + 打 Windows ZIP
#   web job      -> 编译 + 验证 + 打 web ZIP + 单文件 HTML（**唯一一份**）
#   release job  -> 下载上面两个 artifact，算 SHA256，写 manifest，发 Release
#   pages job    -> 下载**同一个** web artifact 部署 Pages
#
# 触发：
#   · 推 v* 标签  -> 全流程，发 Release + 部署 Pages
#   · 手动触发    -> 只构建和部署 Pages，不发 Release（避免误发版）
# =====================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 工具链版本集中在这里，两个 job 共用。
  # 注意：'latest' 仍会随上游漂移，所以 web job 会把 emcc --version
  # 写进 build-manifest.json —— 至少产物是可追溯的。
  # 待 CI 上确认过一个具体版本号后，把它固定下来。
  EMSDK_VERSION: 'latest'
  PYTHON_VERSION: '3.12'

jobs:
  # ------------------------------------------------------------------
  # 1) Windows 桌面版
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup MSYS2 (gcc + windres)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # 发布必须建立在测试通过之上：编译 + test_canity + test_runtime + 分区检查
      - name: Build and validate (gates the release)
        shell: msys2 {0}
        run: |
          python -X utf8 tools/build_sources.py --check
          python -X utf8 tools/content_check.py
          python -X utf8 tools/build_validate.py
          cp canity_verify.exe canity.exe

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-diagnostics
          path: |
            work/codex-build/validation-summary.json
            work/codex-build/validation-*.log
          if-no-files-found: warn

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = (Select-String -Path include/common.h -Pattern 'CANITY_VERSION_STR\s+"([^"]+)"').Matches[0].Groups[1].Value
          $name = "CANITY_v${ver}_win64"
          python -X utf8 tools/package_playable.py --output stage --label $name --notes docs/RELEASE-v${ver}.md --acceptance-report work/codex-build/validation-summary.json --source-commit $env:GITHUB_SHA --single-exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $folder = (Get-Content work/latest_playable_path.txt -Raw).Trim()
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v' + $ver.Replace(' ', '-') }
          Copy-Item -LiteralPath ($folder + '.zip') -Destination (Join-Path stage ("CANITY_" + $tag + "_win64.zip"))

      - uses: actions/upload-artifact@v4
        with:
          name: canity-windows
          path: stage/CANITY_v*_win64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) 网页版（唯一一次编译，Release 与 Pages 共用）
  # ------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Build web
        run: |
          emcc --version | head -1 | tee emcc-version.txt
          python -X utf8 tools/build_web.py
          python -X utf8 tools/build_web.py --single

      - name: Stage web assets
        run: |
          set -e
          VER=$(grep -oP 'CANITY_VERSION_STR\s+"\K[^"]+' include/common.h)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          VER="${VER// /-}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p stage
          cp web/dist/index.html web/dist/index.js web/dist/index.wasm stage/
          cp -R web/dist/music stage/music
          cp LICENSE l10n/OFL-NotoSansSC.txt stage/
          (cd stage && zip -qr "CANITY_v${VER}_web.zip" index.html index.js index.wasm music LICENSE OFL-NotoSansSC.txt)
          cp web/dist/standalone.html "stage/CANITY_v${VER}_web_single.html"
          ls -l stage/

      - uses: actions/upload-artifact@v4
        with:
          name: canity-web
          path: |
            stage/CANITY_v*_web.zip
            stage/CANITY_v*_web_single.html
            web/dist/index.html
            web/dist/index.js
            web/dist/index.wasm
            web/dist/music/
            LICENSE
            l10n/OFL-NotoSansSC.txt
            emcc-version.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) 发 Release（只在推送标签时）
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: canity-windows
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: canity-web
          path: webout

      - name: Collect assets and write manifest
        run: |
          set -e
          mkdir -p assets
          cp webout/stage/*.zip assets/
          cp webout/stage/*.html assets/
          EMCC=$(cat webout/emcc-version.txt || echo unknown)
          SRC_COUNT=$(python -X utf8 tools/build_sources.py | wc -l)
          {
            echo "{"
            echo "  \"tag\": \"${GITHUB_REF_NAME}\","
            echo "  \"sha\": \"${GITHUB_SHA}\","
            echo "  \"run\": \"${GITHUB_RUN_ID}\","
            echo "  \"emcc\": \"${EMCC}\","
            echo "  \"source_files\": ${SRC_COUNT},"
            echo "  \"assets\": {"
            first=1
            for f in assets/*; do
              name=$(basename "$f")
              # The output file exists before this loop because of redirection;
              # it cannot contain a checksum of its own unfinished contents.
              [ "$name" = "build-manifest.json" ] && continue
              size=$(stat -c %s "$f")
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              [ $first -eq 1 ] || echo ","
              first=0
              printf '    "%s": {"size": %s, "sha256": "%s"}' "$name" "$size" "$sum"
            done
            echo ""
            echo "  }"
            echo "}"
          } > assets/build-manifest.json
          cat assets/build-manifest.json

      - name: Create Release and upload three assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/CANITY_v*_win64.zip
            assets/CANITY_v*_web.zip
            assets/CANITY_v*_web_single.html
            assets/build-manifest.json
          generate_release_notes: false
          body_path: docs/RELEASE-${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # 4) 部署 Pages —— 复用 web job 的同一份产物
  # ------------------------------------------------------------------
  pages:
    needs: [web]
    runs-on: ubuntu-latest
    # ================================================================
    # 2026-11-07：**不要挂 github-pages 环境**
    # ----------------------------------------------------------------
    # 第一版这里写了 environment: github-pages，结果 v2.4.2-alpha 部署失败：
    #   Tag "v2.4.2-alpha" is not allowed to deploy to github-pages
    #   due to environment protection rules.
    # 那个环境上有一条"只允许正式标签 / main"的保护规则。
    #
    # actions/deploy-pages 并不需要 environment 才能工作
    # （授权靠 permissions 里的 pages: write + id-token: write），
    # 所以这里直接去掉，预发布标签也能更新站点。
    # ================================================================
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canity-web
          path: webout

      - name: Assemble Pages root
        run: |
          set -e
          mkdir -p pagesroot
          cp webout/web/dist/index.html webout/web/dist/index.js webout/web/dist/index.wasm pagesroot/
          cp -R webout/web/dist/music pagesroot/music
          cp webout/LICENSE pagesroot/LICENSE
          cp webout/l10n/OFL-NotoSansSC.txt pagesroot/OFL-NotoSansSC.txt
          ls -l pagesroot/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pagesroot

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Show page URL
        run: echo "deployed -> ${{ steps.deployment.outputs.page_url }}"
